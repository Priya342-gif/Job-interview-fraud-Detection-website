services:
  - type: web
    name: fraud-detection
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app_company_verify.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true"
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SERPAPI_KEY
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: IMAP_SERVER
        value: imap.gmail.com
      - key: IMAP_PORT
        value: 993
